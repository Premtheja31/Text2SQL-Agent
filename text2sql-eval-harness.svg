<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1436" viewBox="0 0 680 1436" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Text2SQL offline evaluation harness</title>
<style>
text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
.title { font-size: 18px; font-weight: 600; fill: #2C2C2A; }
.sub { font-size: 12px; fill: #5F5E5A; }
.th { font-size: 14px; font-weight: 500; }
.ts { font-size: 12px; font-weight: 400; }
.cap { font-size: 12px; font-weight: 600; fill: #5F5E5A; letter-spacing: 0.4px; }
.arr { fill: none; stroke: #5F5E5A; stroke-width: 1.5; }
.box { fill: #FAFAF8; stroke: #B4B2A9; stroke-width: 1; stroke-dasharray: 5 4; }
.c-gray rect { fill:#F1EFE8; stroke:#5F5E5A; } .c-gray .th { fill:#2C2C2A; } .c-gray .ts { fill:#5F5E5A; }
.c-blue rect { fill:#E6F1FB; stroke:#185FA5; } .c-blue .th { fill:#0C447C; } .c-blue .ts { fill:#185FA5; }
.c-purple rect { fill:#EEEDFE; stroke:#534AB7; } .c-purple .th { fill:#26215C; } .c-purple .ts { fill:#534AB7; }
.c-teal rect { fill:#E1F5EE; stroke:#0F6E56; } .c-teal .th { fill:#04342C; } .c-teal .ts { fill:#0F6E56; }
.c-coral rect { fill:#FAECE7; stroke:#993C1D; } .c-coral .th { fill:#4A1B0C; } .c-coral .ts { fill:#993C1D; }
.c-green rect { fill:#EAF3DE; stroke:#3B6D11; } .c-green .th { fill:#173404; } .c-green .ts { fill:#3B6D11; }
.c-amber rect { fill:#FAEEDA; stroke:#854F0B; } .c-amber .th { fill:#412402; } .c-amber .ts { fill:#854F0B; }
.c-white rect { fill:#FFFFFF; stroke:#B4B2A9; } .c-white .th { fill:#2C2C2A; } .c-white .ts { fill:#5F5E5A; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="1436" fill="#FFFFFF"/>

<text class="title" x="40" y="36">Text2SQL agent — offline evaluation harness</text>
<text class="sub" x="40" y="56">Golden set → agent run → deterministic and LLM-judge evaluation → report and regression gate</text>

<g class="c-gray"><rect x="50" y="80" width="180" height="56" rx="8" stroke-width="0.5"/><text class="th" x="140" y="98" text-anchor="middle" dominant-baseline="central">Admin-authored</text><text class="ts" x="140" y="118" text-anchor="middle" dominant-baseline="central">Hand-written Q + SQL</text></g>
<g class="c-gray"><rect x="250" y="80" width="180" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="98" text-anchor="middle" dominant-baseline="central">LLM-generated</text><text class="ts" x="340" y="118" text-anchor="middle" dominant-baseline="central">Validated by execution</text></g>
<g class="c-gray"><rect x="450" y="80" width="180" height="56" rx="8" stroke-width="0.5"/><text class="th" x="540" y="98" text-anchor="middle" dominant-baseline="central">Production-derived</text><text class="ts" x="540" y="118" text-anchor="middle" dominant-baseline="central">Curated real user questions</text></g>
<path d="M140 136 L140 166 L340 166 L340 196" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="136" x2="340" y2="196" class="arr" marker-end="url(#arrow)"/>
<path d="M540 136 L540 166 L340 166 L340 196" class="arr" marker-end="url(#arrow)"/>

<g class="c-teal"><rect x="190" y="196" width="300" height="96" rx="8" stroke-width="0.5"/><text class="th" x="340" y="214" text-anchor="middle" dominant-baseline="central">Golden set per database_key</text><text class="ts" x="340" y="234" text-anchor="middle" dominant-baseline="central">question, golden SQL, expected result</text><text class="ts" x="340" y="252" text-anchor="middle" dominant-baseline="central">expected answer, order sensitivity</text><text class="ts" x="340" y="270" text-anchor="middle" dominant-baseline="central">query type, tags, version</text></g>
<line x1="340" y1="292" x2="340" y2="332" class="arr" marker-end="url(#arrow)"/>

<g class="c-blue"><rect x="190" y="332" width="300" height="96" rx="8" stroke-width="0.5"/><text class="th" x="340" y="350" text-anchor="middle" dominant-baseline="central">Eval run (CI job)</text><text class="ts" x="340" y="370" text-anchor="middle" dominant-baseline="central">Offline mode: no cache, no rate limits</text><text class="ts" x="340" y="388" text-anchor="middle" dominant-baseline="central">N runs per case, temperature 0</text><text class="ts" x="340" y="406" text-anchor="middle" dominant-baseline="central">Model and prompt version pinned</text></g>
<line x1="505" y1="380" x2="490" y2="380" class="arr" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<g class="c-white"><rect x="505" y="322" width="130" height="116" rx="8" stroke-width="1" stroke-dasharray="4 3"/><text class="th" x="570" y="340" text-anchor="middle" dominant-baseline="central">Triggers</text><text class="ts" x="570" y="360" text-anchor="middle" dominant-baseline="central">Prompt change</text><text class="ts" x="570" y="378" text-anchor="middle" dominant-baseline="central">Few-shot change</text><text class="ts" x="570" y="396" text-anchor="middle" dominant-baseline="central">Schema refresh</text><text class="ts" x="570" y="414" text-anchor="middle" dominant-baseline="central">Model change</text></g>

<path d="M340 428 L340 458 L180 458 L180 488" class="arr" marker-end="url(#arrow)"/>
<path d="M340 428 L340 458 L500 458 L500 488" class="arr" marker-end="url(#arrow)"/>

<g class="c-purple"><rect x="50" y="488" width="260" height="96" rx="8" stroke-width="1"/><text class="th" x="180" y="506" text-anchor="middle" dominant-baseline="central">Run agent graph per case</text><text class="ts" x="180" y="526" text-anchor="middle" dominant-baseline="central">Rewrite, classify, SQL, execute</text><text class="ts" x="180" y="544" text-anchor="middle" dominant-baseline="central">Self-correction, max 2 attempts</text><text class="ts" x="180" y="562" text-anchor="middle" dominant-baseline="central">Generated SQL, result, NL answer</text></g>
<g class="c-teal"><rect x="370" y="488" width="260" height="96" rx="8" stroke-width="0.5"/><text class="th" x="500" y="506" text-anchor="middle" dominant-baseline="central">Execute golden SQL</text><text class="ts" x="500" y="526" text-anchor="middle" dominant-baseline="central">Same read-only connection</text><text class="ts" x="500" y="544" text-anchor="middle" dominant-baseline="central">Timeout and row cap</text><text class="ts" x="500" y="562" text-anchor="middle" dominant-baseline="central">Expected result, recomputed</text></g>
<path d="M180 584 L180 614 L340 614 L340 644" class="arr" marker-end="url(#arrow)"/>
<path d="M500 584 L500 614 L340 614 L340 644" class="arr" marker-end="url(#arrow)"/>

<g class="c-blue"><rect x="190" y="644" width="300" height="116" rx="8" stroke-width="0.5"/><text class="th" x="340" y="662" text-anchor="middle" dominant-baseline="central">Deterministic evaluation</text><text class="ts" x="340" y="682" text-anchor="middle" dominant-baseline="central">SQL: exact match, semantic equivalence</text><text class="ts" x="340" y="700" text-anchor="middle" dominant-baseline="central">Execution: success, retries, latency</text><text class="ts" x="340" y="718" text-anchor="middle" dominant-baseline="central">Result: order-aware multiset, tolerance</text><text class="ts" x="340" y="736" text-anchor="middle" dominant-baseline="central">Precision, recall, F1, row count, order</text></g>
<line x1="340" y1="760" x2="340" y2="800" class="arr" marker-end="url(#arrow)"/>

<g class="c-amber"><rect x="190" y="800" width="300" height="96" rx="8" stroke-width="0.5"/><text class="th" x="340" y="818" text-anchor="middle" dominant-baseline="central">LLM-as-a-judge (answer quality)</text><text class="ts" x="340" y="838" text-anchor="middle" dominant-baseline="central">Correctness, groundedness, relevance</text><text class="ts" x="340" y="856" text-anchor="middle" dominant-baseline="central">Completeness, consistency, hallucination</text><text class="ts" x="340" y="874" text-anchor="middle" dominant-baseline="central">Separate model, fixed rubric, calibrated</text></g>
<line x1="340" y1="896" x2="340" y2="936" class="arr" marker-end="url(#arrow)"/>

<g class="c-gray"><rect x="90" y="936" width="500" height="196" rx="8" stroke-width="0.5"/><text class="th" x="340" y="954" text-anchor="middle" dominant-baseline="central">Evaluation report and regression gate</text><text class="ts" x="340" y="978" text-anchor="middle" dominant-baseline="central">Dataset size · SQL exact match % · Semantic equivalence %</text><text class="ts" x="340" y="996" text-anchor="middle" dominant-baseline="central">Execution success % · Self-correction success % · Order accuracy %</text><text class="ts" x="340" y="1014" text-anchor="middle" dominant-baseline="central">Row count accuracy % · Precision % · Recall % · F1 %</text><text class="ts" x="340" y="1032" text-anchor="middle" dominant-baseline="central">LLM judge answer score · Groundedness score</text><text class="ts" x="340" y="1050" text-anchor="middle" dominant-baseline="central">Avg execution latency · Avg end-to-end latency · Tokens, cost</text><text class="ts" x="340" y="1074" text-anchor="middle" dominant-baseline="central">Per query type and per database · mean ± variance over N runs</text><text class="ts" x="340" y="1092" text-anchor="middle" dominant-baseline="central">Reported separately, no combined score · failure triage with trace links</text><text class="ts" x="340" y="1110" text-anchor="middle" dominant-baseline="central">Versioned baseline per config · CI blocks deploy on headline drop</text></g>
<line x1="340" y1="1132" x2="340" y2="1172" class="arr" marker-end="url(#arrow)"/>

<rect class="box" x="40" y="1172" width="600" height="224" rx="12"/>
<text class="cap" x="52" y="1190">EVALUATION PLATFORM — LangSmith or Arize Phoenix · instruments every run</text>
<g class="c-white"><rect x="60" y="1204" width="180" height="76" rx="8" stroke-width="1"/><text class="th" x="150" y="1222" text-anchor="middle" dominant-baseline="central">LangGraph tracing</text><text class="ts" x="150" y="1242" text-anchor="middle" dominant-baseline="central">Nodes, LLM calls, retries</text><text class="ts" x="150" y="1260" text-anchor="middle" dominant-baseline="central">captured as nested spans</text></g>
<g class="c-white"><rect x="250" y="1204" width="180" height="76" rx="8" stroke-width="1"/><text class="th" x="340" y="1222" text-anchor="middle" dominant-baseline="central">Agent debugging</text><text class="ts" x="340" y="1242" text-anchor="middle" dominant-baseline="central">Replay any failed case</text><text class="ts" x="340" y="1260" text-anchor="middle" dominant-baseline="central">step by step from its trace</text></g>
<g class="c-white"><rect x="440" y="1204" width="180" height="76" rx="8" stroke-width="1"/><text class="th" x="530" y="1222" text-anchor="middle" dominant-baseline="central">Dataset evaluations</text><text class="ts" x="530" y="1242" text-anchor="middle" dominant-baseline="central">Golden set versioned</text><text class="ts" x="530" y="1260" text-anchor="middle" dominant-baseline="central">runs compared side by side</text></g>
<g class="c-white"><rect x="60" y="1300" width="370" height="76" rx="8" stroke-width="1"/><text class="th" x="245" y="1318" text-anchor="middle" dominant-baseline="central">Custom evaluators</text><text class="ts" x="245" y="1338" text-anchor="middle" dominant-baseline="central">SQL exact match · Execution success</text><text class="ts" x="245" y="1356" text-anchor="middle" dominant-baseline="central">Precision / Recall / F1 · LLM-as-a-judge</text></g>
<g class="c-white"><rect x="440" y="1300" width="180" height="76" rx="8" stroke-width="1"/><text class="th" x="530" y="1318" text-anchor="middle" dominant-baseline="central">Result tracking</text><text class="ts" x="530" y="1338" text-anchor="middle" dominant-baseline="central">Latency, tokens, cost</text><text class="ts" x="530" y="1356" text-anchor="middle" dominant-baseline="central">scores per run, over time</text></g>
</svg>
